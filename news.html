<meta name="description" content="النهرين — بيع مكائن ومعدات الإعلان وقطع غيارها ومواد تجهيز الإعلان في العراق | Al-Nahrain sign-making machines and materials, Iraq">
<meta name="theme-color" content="#101820">
<link rel="icon" type="image/png" href="assets/img/452dd46c02f87175012c47942e375813.png">
<link rel="stylesheet" href="assets/nahrain.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FA}
.band{position:relative;overflow:hidden;background:linear-gradient(165deg,#101820 0%,#0F2232 60%,#0B2F46 100%);color:#fff}
.band .gl{position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(0,155,213,.36),transparent 64%);filter:blur(16px);top:-300px;right:8%;animation:gm 16s ease-in-out infinite alternate}
@keyframes gm{from{transform:translate(0,0)}to{transform:translate(-160px,80px)}}
.fu{animation:fadeUp 1s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.feat{display:flex;flex-wrap:wrap;gap:0;border-radius:28px;overflow:hidden;background:#14202B;border:1px solid #24333F;text-align:start;color:#fff;padding:0;width:100%}
.feat .ph,.feat img{min-height:380px;height:100%;width:100%;object-fit:cover;display:flex;transition:transform 1.4s var(--ease)}
.feat:hover .ph,.feat:hover img{transform:scale(1.05)}
.acard{display:flex;flex-direction:column;overflow:hidden;height:100%;width:100%;text-align:start;padding:0;color:#101820}
.reader{position:fixed;inset:0;z-index:90;background:#FFFFFF;color:#101820;overflow-y:auto;animation:readIn .6s var(--ease) both}
@keyframes readIn{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.reader .prog>*{animation:fadeUp .8s var(--ease) backwards;animation-delay:calc(.25s + var(--i,0) * 90ms)}
.reader p{font-size:19px;line-height:1.95;margin:0;color:#26343F}
.share{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid #DDE4EA;background:#fff;color:#101820;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.share:hover{border-color:#009BD5;color:#101820}
@media (max-width:760px){
  .nh section > div{padding-inline:16px!important}
  .feat .ph,.feat img{min-height:240px}
  .reader p{font-size:17px}
  .annbar .ann-long{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">

<div class="nh" dir="{{dir}}" lang="{{lang}}" style="font-family: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif; color: #101820; background: #F6F8FA; line-height: 1.7; min-width: 0; min-height: 100vh; overflow-x: clip">
<div class="curtain" aria-hidden="true"></div>

<sc-if value="{{annOn}}" hint-placeholder-val="{{ true }}">

<span class="ann-tag">{{t.newTag}}</span><button type="button" onClick="{{openLaunch}}" style="position: relative; z-index: 1; background: transparent; border: 0; color: #101820; font-weight: 600; font-size: 14px; min-height: 40px">{{annText}} <span aria-hidden="true">{{t.arrow}}</span></button>
<button type="button" class="ann-x" onClick="{{closeAnn}}" aria-label="{{t.close}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div></div>
</sc-if>

<header class="nav">
<div style="max-width: 1320px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; box-sizing: border-box">
<a href="index.html" class="brand" aria-label="{{t.home}}" style="display: flex; align-items: center; gap: 12px; text-decoration: none"><span class="logo-m" style="height: 46px"></span><span class="logo-w" style="height: 26px"></span></a>
<nav class="nav-links" aria-label="{{t.mainNav}}" style="font-size: 15px"><sc-for list="{{navItems}}" as="n" hint-placeholder-count="5"><a class="{{n.cls}}" href="{{n.href}}">{{n.label}}</a></sc-for></nav>

</div>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><nav class="mmenu" aria-label="{{t.menu}}"><sc-for list="{{navItems}}" as="n" hint-placeholder-count="5"><a href="{{n.href}}">{{n.label}}</a></sc-for></nav></sc-if>

<section class="band">
<div class="gl" aria-hidden="true"></div>
<div style="position: relative; max-width: 1320px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<div class="fu" style="display: flex; flex-direction: column; gap: 10px">
<nav aria-label="{{t.crumb}}" style="font-size: 14px; color: #A9B8C6"><a href="index.html" style="color: #A9B8C6">{{t.homeLabel}}</a> / {{t.title}}</nav>
<h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: clamp(32px, 4.6vw, 56px); line-height: 1.15">{{t.title}}</h1>
<p style="margin: 0; color: #C9D6E0; font-size: 18px; max-width: 640px">{{t.sub}}</p>
</div>
<button type="button" class="feat fu" onClick="{{featured.open}}" style="animation-delay: .4s" aria-label="{{featured.title}}">
<div style="flex: 1.3 1 460px; min-width: 0; overflow: hidden; position: relative">
<sc-if value="{{featured.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{featured.img}}" alt=""></sc-if>
<sc-if value="{{featured.noImg}}" hint-placeholder-val="{{ true }}"><span class="ph" style="font-size: 14px">{{featured.ph}}</span></sc-if>
<sc-if value="{{featured.isLaunch}}" hint-placeholder-val="{{ true }}"><span class="new-badge" style="position: absolute; top: 18px; inset-inline-start: 18px; font-size: 14px; padding: 6px 14px">{{t.newTag}}</span></sc-if>
</div>
<div style="flex: 1 1 380px; min-width: 0; padding: 36px; display: flex; flex-direction: column; gap: 14px; justify-content: center; box-sizing: border-box">
<span style="font-size: 14px; color: #7FD3F5; font-weight: 600">{{featured.cat}} · {{featured.date}}</span>
<strong style="font-family: 'Readex Pro', sans-serif; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.3">{{featured.title}}</strong>
<span style="color: #C9D6E0; font-size: 17px">{{featured.excerpt}}</span>
<span class="btn btn-sky" style="align-self: flex-start; margin-top: 8px">{{t.read}}</span>
</div>
</button>
</div>
</section>

<section>
<div style="max-width: 1320px; margin: 0 auto; padding: 44px 24px 90px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 28px">
<div role="group" aria-label="{{t.filter}}" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button type="button" class="chip-l" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}">{{c.label}}</button></sc-for></div>
<div style="position: relative; flex: 0 1 320px; min-width: 220px">
<label for="n-q" class="sr">{{t.search}}</label>
<input id="n-q" class="field field-l" type="search" placeholder="{{t.search}}" value="{{query}}" onInput="{{onSearch}}" style="padding-inline-start: 44px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#55636F" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; top: 16px; inset-inline-start: 16px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
</div>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><div style="border: 1px dashed #C5CFD8; border-radius: 22px; padding: 56px; text-align: center; color: #55636F; background: #fff">{{t.none}}</div></sc-if>
<div class="swap stag {{gridOut}}" style="display: flex; flex-wrap: wrap; gap: 22px">
<sc-for list="{{list}}" as="a" hint-placeholder-count="6">
<div style="--i: {{a.i}}; flex: 1 1 320px; min-width: 0">
<div class="grow-sm" style="height: 100%">
<button type="button" class="lcard lift-l acard" onClick="{{a.open}}">
<div class="zoom" style="height: 210px; width: 100%; position: relative"><div class="zi ph ph-g" style="height: 100%">{{a.ph}}</div><sc-if value="{{a.isLaunch}}" hint-placeholder-val="{{ false }}"><span class="new-badge" style="position: absolute; top: 14px; inset-inline-start: 14px">{{t.newTag}}</span></sc-if></div>
<div style="padding: 22px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; width: 100%; box-sizing: border-box">
<span style="font-size: 13px; color: #00739E; font-weight: 600">{{a.cat}} · {{a.date}} · {{a.mins}}</span>
<strong style="font-family: 'Readex Pro', sans-serif; font-size: 20px; font-weight: 600; line-height: 1.4">{{a.title}}</strong>
<span style="font-size: 15px; color: #4F5D69">{{a.excerpt}}</span>
<span style="margin-top: auto; padding-top: 8px; color: #00739E; font-weight: 700; font-size: 15px">{{t.read}} {{t.arrow}}</span>
</div>
</button>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<!-- اشتراك بالإعلانات -->
<section class="light">
<div style="max-width: 1320px; margin: 0 auto; padding: 80px 24px">
<div class="grow" style="background: #101820; color: #fff; border-radius: 28px; padding: clamp(24px, 4vw, 48px); display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between; position: relative; overflow: hidden">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<span class="eyebrow">{{t.subEyebrow}}</span>
<strong style="font-family: 'Readex Pro', sans-serif; font-size: clamp(24px, 3vw, 36px); line-height: 1.3">{{t.subTitle}}</strong>
<span style="color: #C9D6E0">{{t.subText}}</span>
</div>
<sc-if value="{{notSubbed}}" hint-placeholder-val="{{ true }}">
<form style="flex: 1 1 360px; min-width: 0; display: flex; gap: 10px; flex-wrap: wrap">
<label for="sub-phone" class="sr">{{t.waNumber}}</label>
<input id="sub-phone" class="field" type="tel" placeholder="{{t.waNumber}}" style="flex: 1 1 200px">
<button type="button" class="btn btn-sky" onClick="{{subscribe}}" style="border: 0">{{t.subscribe}}</button>
</form>
</sc-if>
<sc-if value="{{subbed}}" hint-placeholder-val="{{ false }}"><span class="modal" role="status" style="flex: 1 1 360px; font-weight: 600; color: #7FD3F5">{{t.subbed}}</span></sc-if>
</div>
</div>
</section>

<footer style="background: #101820; color: #A9B8C6; font-size: 14px">
<div style="max-width: 1320px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 10px; color: #fff"><span class="logo-m" style="height: 34px"></span><span class="logo-w" style="height: 18px"></span></span>
<span>{{t.rights}} · <a href="admin.html" style="color: #A9B8C6">{{t.admin}}</a></span>
</div>
</footer>

<!-- قارئ المقال -->
<sc-if value="{{readerOpen}}" hint-placeholder-val="{{ false }}">
<article class="reader" role="dialog" aria-label="{{art.title}}">
<div style="position: sticky; top: 0; z-index: 2; background: rgba(255,255,255,.92); backdrop-filter: blur(12px); border-bottom: 1px solid #EDF1F4">
<div style="max-width: 860px; margin: 0 auto; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px">
<button type="button" onClick="{{closeReader}}" class="share">{{t.back}}</button>
<span style="font-size: 13px; color: #55636F">{{art.mins}}</span>
</div>
</div>
<div class="prog" style="max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; display: flex; flex-direction: column; gap: 22px">
<span style="--i: 0; font-size: 14px; color: #00739E; font-weight: 600">{{art.cat}} · {{art.date}}</span>
<h2 style="--i: 1; margin: 0; font-family: 'Readex Pro', sans-serif; font-size: clamp(28px, 4vw, 44px); line-height: 1.25">{{art.title}}</h2>
<div style="--i: 2; border-radius: 22px; overflow: hidden; position: relative">
<sc-if value="{{art.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{art.img}}" alt="" style="width: 100%; max-height: 460px; object-fit: cover; display: block"></sc-if>
<sc-if value="{{art.noImg}}" hint-placeholder-val="{{ true }}"><div class="ph ph-g" style="height: 380px">{{art.ph}}</div></sc-if>
</div>
<sc-for list="{{art.body}}" as="p" hint-placeholder-count="4"><p style="--i: 3">{{p}}</p></sc-for>
<sc-if value="{{art.isLaunch}}" hint-placeholder-val="{{ false }}">
<div style="--i: 4; background: #EAF6FC; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 14px">
<strong style="font-family: 'Readex Pro', sans-serif; font-size: 20px">{{t.specs}}</strong>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><sc-for list="{{art.specs}}" as="s" hint-placeholder-count="4"><span style="background: #fff; border: 1px solid #D3E5EF; border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #4F5D69">{{s.k}}</span><strong style="font-weight: 600">{{s.v}}</strong></span></sc-for></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px"><a class="btn btn-sky" href="index.html">{{t.quote}}</a><a class="btn btn-line" href="store.html">{{t.toStore}}</a></div>
</div>
</sc-if>
<div style="--i: 5; display: flex; flex-wrap: wrap; gap: 10px; padding-top: 18px; border-top: 1px solid #EDF1F4; align-items: center">
<span style="font-weight: 600; margin-inline-end: 6px">{{t.share}}</span>
<a class="share" href="https://wa.me/?text=[رابط المقال]"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"></path></svg>WhatsApp</a>
<a class="share" href="https://www.facebook.com/sharer/sharer.php">Facebook</a>
<button type="button" class="share" onClick="{{copyLink}}">{{copyLabel}}</button>
</div>
</div>
</article>
</sc-if>
<a class="fab" href="https://wa.me/9647XXXXXXXXX" aria-label="WhatsApp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"></path></svg></a>
</div>
</script>
