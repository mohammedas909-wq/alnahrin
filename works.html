<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النهرين — أعمالنا | Our work</title>
<meta name="description" content="النهرين — بيع مكائن ومعدات الإعلان وقطع غيارها ومواد تجهيز الإعلان في العراق | Al-Nahrain sign-making machines and materials, Iraq">
<meta name="theme-color" content="#101820">
<link rel="icon" type="image/png" href="assets/img/452dd46c02f87175012c47942e375813.png">
<link rel="stylesheet" href="assets/nahrain.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F8FA}
.band{position:relative;overflow:hidden;background:linear-gradient(165deg,#101820 0%,#0F2232 60%,#0B2F46 100%);color:#fff}
.band .gl{position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(0,155,213,.36),transparent 64%);filter:blur(16px);top:-300px;left:8%;animation:gm 16s ease-in-out infinite alternate}
@keyframes gm{from{transform:translate(0,0)}to{transform:translate(160px,80px)}}
.hero-img{border-radius:24px;overflow:hidden;height:100%;min-height:340px}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block;animation:kb 18s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.fu{animation:fadeUp 1s var(--ease) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:280px;gap:18px}
.w-big{grid-row:span 2}
.wi{position:relative;display:block;width:100%;height:100%;padding:0;border:0;border-radius:22px;overflow:hidden;background:#EDF1F4;text-align:start;color:#fff}
.wi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s var(--ease),filter .6s}
.wi .ph{width:100%;height:100%;transition:transform 1.2s var(--ease)}
.wi:hover img,.wi:focus-visible img{transform:scale(1.07);filter:brightness(.72)}
.wi:hover .ph{transform:scale(1.05)}
.wi .cap{position:absolute;inset-inline:0;bottom:0;padding:52px 20px 18px;background:linear-gradient(to top,rgba(8,14,20,.9),rgba(8,14,20,0));display:flex;flex-direction:column;gap:2px;transform:translateY(26px);transition:transform .5s var(--ease)}
.wi .cap .det{opacity:0;transition:opacity .4s}
.wi:hover .cap,.wi:focus-visible .cap{transform:none}.wi:hover .cap .det,.wi:focus-visible .cap .det{opacity:1}
.lb-img{transition:opacity .25s,transform .35s var(--ease)}.lb-img.out{opacity:0;transform:scale(.97)}
@media (max-width:900px){.wgrid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:230px}}
@media (max-width:560px){.wgrid{grid-template-columns:minmax(0,1fr)}.w-big{grid-row:auto}}
@media (max-width:760px){.nh section > div{padding-inline:16px!important}.hero-img{min-height:240px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">

<div class="nh" dir="{{dir}}" lang="{{lang}}" style="font-family: 'IBM Plex Sans Arabic', 'Readex Pro', system-ui, sans-serif; color: #101820; background: #F6F8FA; line-height: 1.7; min-width: 0; min-height: 100vh; overflow-x: clip">
<div class="curtain" aria-hidden="true"></div>

<sc-if value="{{annOn}}" hint-placeholder-val="{{ true }}">
<div class="annbar" role="region" aria-label="{{t.annAria}}"><div style="max-width: 1320px; margin: 0 auto; padding: 0 16px; min-height: 42px; display: flex; align-items: center; justify-content: center; gap: 12px">
<span class="ann-tag">{{t.newTag}}</span><a href="store.html" style="position: relative; z-index: 1">{{annText}} <span aria-hidden="true">{{t.arrow}}</span></a>
<button type="button" class="ann-x" onClick="{{closeAnn}}" aria-label="{{t.close}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div></div>
</sc-if>

<header class="nav">
<div style="max-width: 1320px; height: 100%; margin: 0 auto; padding: 0 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; box-sizing: border-box">
<a href="index.html" class="brand" aria-label="{{t.home}}" style="display: flex; align-items: center; gap: 12px; text-decoration: none"><span class="logo-m" style="height: 46px"></span><span class="logo-w" style="height: 26px"></span></a>
<nav class="nav-links" aria-label="{{t.mainNav}}" style="font-size: 15px"><sc-for list="{{navItems}}" as="n" hint-placeholder-count="5"><a class="{{n.cls}}" href="{{n.href}}">{{n.label}}</a></sc-for></nav>
<div style="display: flex; gap: 8px; align-items: center">
<button type="button" class="lang-btn" onClick="{{toggleLang}}" lang="{{t.otherLangCode}}" aria-label="{{t.langAria}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"></path></svg>{{t.otherLang}}</button>
<a class="btn btn-sky nav-cta" href="https://wa.me/9647XXXXXXXXX" style="min-height: 44px; padding: 0 18px; font-size: 15px">{{t.orderPrint}}</a>
<button type="button" class="iconbtn burger" onClick="{{toggleMenu}}" aria-label="{{t.menu}}" aria-expanded="{{menuExpanded}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</div>
</div>
</header>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}"><nav class="mmenu" aria-label="{{t.menu}}"><sc-for list="{{navItems}}" as="n" hint-placeholder-count="5"><a href="{{n.href}}">{{n.label}}</a></sc-for></nav></sc-if>

<section class="band">
<div class="gl" aria-hidden="true"></div>
<div style="position: relative; max-width: 1320px; margin: 0 auto; padding: 64px 24px; display: flex; flex-wrap: wrap; gap: 40px; align-items: stretch">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px; justify-content: center">
<nav aria-label="{{t.crumb}}" class="fu" style="font-size: 14px; color: #A9B8C6"><a href="index.html" style="color: #A9B8C6">{{t.homeLabel}}</a> / {{t.worksLabel}}</nav>
<span class="eyebrow fu" style="animation-delay: .5s">{{t.worksLabel}}</span>
<h1 class="fu" style="animation-delay: .7s; margin: 0; font-family: 'Readex Pro', sans-serif; font-size: clamp(34px, 5vw, 60px); line-height: 1.15">{{t.title}}</h1>
<p class="fu" style="animation-delay: .9s; margin: 0; color: #C9D6E0; font-size: 18px; max-width: 560px">{{t.sub}}</p>
</div>
<div class="fu" style="animation-delay: .6s; flex: 1 1 440px; min-width: 0"><div class="hero-img"><img src="assets/img/d38d70f55892e853b8519f8a77491ce6.jpg" alt="{{t.heroAlt}}"></div></div>
</div>
</section>

<section>
<div style="max-width: 1320px; margin: 0 auto; padding: 48px 24px 100px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center; margin-bottom: 28px">
<div role="group" aria-label="{{t.filter}}" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="7"><button type="button" class="chip-l" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}">{{c.label}} <span style="opacity: .6; font-weight: 500">{{c.n}}</span></button></sc-for></div>
<span style="color: #55636F; font-size: 15px">{{count}} {{t.items}}</span>
</div>
<div class="wgrid swap stag {{gridOut}}">
<sc-for list="{{works}}" as="w" hint-placeholder-count="9">
<div class="{{w.span}}" style="--i: {{w.i}}">
<div class="grow" style="height: 100%; animation-range: entry {{w.r1}} cover {{w.r2}}">
<button type="button" class="wi" onClick="{{w.open}}" aria-label="{{w.title}}">
<sc-if value="{{w.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{w.src}}" alt="{{w.title}}" loading="lazy"></sc-if>
<sc-if value="{{w.noImg}}" hint-placeholder-val="{{ false }}"><span class="ph ph-g"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#009BD5" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{w.icon}}"></path></svg><span>{{w.ph}}</span></span></sc-if>
<span class="cap"><span style="font-size: 12px; color: #7FD3F5; font-weight: 600">{{w.cat}}</span><strong style="font-family: 'Readex Pro', sans-serif; font-size: 18px; font-weight: 600">{{w.title}}</strong><span class="det" style="font-size: 14px; color: #D5E0E8">{{w.desc}}</span></span>
</button>
</div>
</div>
</sc-for>
</div>
</div>
</section>

<section class="light">
<div style="max-width: 1320px; margin: 0 auto; padding: 90px 24px; display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<span class="eyebrow t1">{{t.ctaEyebrow}}</span>
<h2 class="h2 t2">{{t.ctaTitle}}</h2>
<p class="muted t3" style="margin: 0; font-size: 18px">{{t.ctaText}}</p>
</div>
<div class="t4" style="display: flex; flex-wrap: wrap; gap: 12px"><a class="btn btn-sky" href="https://wa.me/9647XXXXXXXXX">{{t.orderPrint}}</a><a class="btn btn-navy" href="store.html">{{t.browseMachines}}</a></div>
</div>
</section>

<footer style="background: #101820; color: #A9B8C6; font-size: 14px">
<div style="max-width: 1320px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<span style="display: flex; align-items: center; gap: 10px; color: #fff"><span class="logo-m" style="height: 34px"></span><span class="logo-w" style="height: 18px"></span></span>
<span>{{t.rights}} · <a href="admin.html" style="color: #A9B8C6">{{t.admin}}</a></span>
</div>
</footer>

<sc-if value="{{lbOpen}}" hint-placeholder-val="{{ false }}">
<div class="shade" onClick="{{closeLb}}"></div>
<div style="position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 20px; pointer-events: none">
<div class="modal" role="dialog" aria-label="{{lb.title}}" style="pointer-events: auto; width: min(1100px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 14px">
<div class="lb-img {{lbOutClass}}" style="border-radius: 18px; overflow: hidden; background: #0B141C; min-height: 300px; display: flex">
<sc-if value="{{lb.hasImg}}" hint-placeholder-val="{{ true }}"><img src="{{lb.src}}" alt="{{lb.title}}" style="width: 100%; max-height: 72vh; object-fit: contain; display: block"></sc-if>
<sc-if value="{{lb.noImg}}" hint-placeholder-val="{{ false }}"><span class="ph" style="flex: 1; min-height: 380px; font-size: 15px">{{lb.ph}}</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; color: #FFFFFF">
<div style="display: flex; flex-direction: column"><span style="font-size: 13px; color: #7FD3F5">{{lb.cat}} · {{lbCount}}</span><strong style="font-family: 'Readex Pro', sans-serif; font-size: 21px; font-weight: 600">{{lb.title}}</strong><span style="color: #C3D2DE; font-size: 15px">{{lb.desc}}</span></div>
<div style="display: flex; gap: 8px">
<button type="button" class="iconbtn" onClick="{{prevLb}}" aria-label="{{t.prev}}" style="color: #fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{t.prevIcon}}"></path></svg></button>
<button type="button" class="iconbtn" onClick="{{nextLb}}" aria-label="{{t.next}}" style="color: #fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{t.nextIcon}}"></path></svg></button>
<button type="button" class="iconbtn" onClick="{{closeLb}}" aria-label="{{t.close}}" style="color: #fff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
</div>
</div>
</div>
</sc-if>
<a class="fab" href="https://wa.me/9647XXXXXXXXX" aria-label="WhatsApp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-13.4 7.9L3 21l1.2-4.4A9 9 0 1 1 21 12z"></path></svg></a>
</div>
</script>
