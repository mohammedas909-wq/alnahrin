<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>النهرين — لوحة التحكم</title>
<meta name="description" content="النهرين — بيع مكائن ومعدات الإعلان وقطع غيارها ومواد تجهيز الإعلان في العراق | Al-Nahrain sign-making machines and materials, Iraq">
<meta name="theme-color" content="#101820">
<link rel="icon" type="image/png" href="assets/img/452dd46c02f87175012c47942e375813.png">
<link rel="stylesheet" href="assets/nahrain.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Readex+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lt{color:#101820}
.lt .st-ok{background:#D9F0FA;color:#005A7E;border:1px solid #8FD0EC}
.lt .st-low{background:#FFFFFF;color:#26343F;border:1px dashed #8A9AA8}
.lt .st-out{background:#EDF1F4;color:#55636F;border:1px solid #DDE4EA}
.lt .st-new{background:#009BD5;color:#101820}
.lt .st-prog{background:#101820;color:#FFFFFF;border:1px solid #101820}
.card{background:#FFFFFF;border:1px solid #DDE4EA;border-radius:18px}
.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:720px}
.tbl th{text-align:right;font-weight:600;color:#55636F;font-size:13px;padding:12px 14px;border-bottom:1px solid #DDE4EA;white-space:nowrap;background:#F6F8FA}
.tbl td{padding:12px 14px;border-bottom:1px solid #EDF1F4;vertical-align:middle}
.tbl tbody tr:hover{background:#F6FBFE}
.ib{width:40px;height:40px;border-radius:10px;border:1px solid #DDE4EA;background:#fff;color:#26343F;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.ib:hover{border-color:#009BD5;color:#00739E}
.ib:disabled{opacity:.35}
.tab{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border-radius:12px;font-size:15px;text-align:right;background:transparent;color:#C3D2DE;border:1px solid transparent;transition:all .3s var(--ease)}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab[aria-current="page"]{background:rgba(0,155,213,.18);border-color:rgba(0,155,213,.6);color:#fff;font-weight:600}
.tab .ti{display:flex;align-items:center;gap:10px}
.tgrp{font-size:12px;color:#7D8C99;padding:10px 12px 2px;font-weight:600}
.seg{min-height:42px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:600;border:1px solid #DDE4EA;background:#fff;color:#101820;transition:all .25s}
.seg[aria-pressed="true"]{background:#101820;border-color:#101820;color:#fff}
.opt{flex:1 1 150px;min-height:72px;border-radius:14px;border:1.5px solid #DDE4EA;background:#fff;color:#101820;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:10px 14px;text-align:right;transition:all .25s}
.opt[aria-pressed="true"]{border-color:#009BD5;box-shadow:0 0 0 4px rgba(0,155,213,.18)}
.sw{position:relative;width:46px;height:26px;border-radius:13px;background:#C5CFD8;border:0;padding:0;flex-shrink:0;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:#009BD5}.sw[aria-checked="true"]::after{transform:translateX(-20px)}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #EDF1F4;border-radius:12px;background:#fff;transition:all .35s var(--ease);flex-wrap:wrap}
.row.off{opacity:.55;background:#F6F8FA}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}
.fl label,.fl .lb{font-weight:600;font-size:14px}
.hint{font-size:12px;color:#55636F}
.drop{border:2px dashed #9FD6EE;background:#F3FAFE;border-radius:18px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:all .25s}
.drop.on{background:#EAF6FC;border-color:#009BD5;transform:scale(1.01)}
.upl{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:#101820;color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
.mthumb{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:2px solid transparent;padding:0;background:#EDF1F4;width:100%}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb:hover,.mthumb[aria-pressed="true"]{border-color:#009BD5}
.lt-tabs{display:inline-flex;background:#EDF1F4;border-radius:12px;padding:4px;gap:4px}
.lt-tabs button{min-height:36px;padding:0 14px;border-radius:9px;border:0;background:transparent;font-weight:700;font-size:13px;color:#3D4A55}
.lt-tabs button[aria-pressed="true"]{background:#fff;color:#101820;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pv-sec{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;animation:stagIn .4s var(--ease) backwards;animation-delay:calc(var(--i) * 50ms)}
.panel{animation:panelIn .45s var(--ease) both}
@keyframes panelIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wide{width:min(760px,100%)!important}
.gpre{border:1px solid #EDF1F4;border-radius:12px;padding:12px 14px;background:#fff;font-family:arial,sans-serif}
@media (max-width:760px){main{padding:18px 14px 64px!important}.card{border-radius:14px}}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-dc-template" id="dc-template">

<div class="nh lt" dir="rtl" style="font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; background: #F6F8FA; line-height: 1.6; min-width: 0; min-height: 100vh">

<sc-if value="{{loggedOut}}" hint-placeholder-val="{{ false }}">
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: linear-gradient(165deg,#101820 0%,#0F2232 60%,#0B2F46 100%)">
<form class="modal" style="width: min(420px, 100%); background: #FFFFFF; border-radius: 24px; padding: 36px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
<div style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: #009BD5"><span class="logo-m" style="height: 80px"></span><span class="logo-w" style="height: 26px"></span></div>
<h1 style="margin: 0; text-align: center; font-family: 'Readex Pro', sans-serif; font-size: 22px">دخول لوحة الإدارة</h1>
<div class="fl"><label for="l-user">اسم المستخدم</label><input id="l-user" class="field field-l" type="text" autocomplete="username"></div>
<div class="fl"><label for="l-pass">كلمة المرور</label><input id="l-pass" class="field field-l" type="password" autocomplete="current-password"></div>
<button type="button" class="btn btn-sky" onClick="{{login}}" style="border: 0">دخول</button>
<a href="index.html" style="text-align: center; font-size: 14px; color: #00739E">العودة إلى الموقع</a>
</form>
</div>
</sc-if>

<sc-if value="{{loggedIn}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh">

<aside style="flex: 1 1 250px; max-width: 100%; background: #101820; color: #fff; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<a href="index.html" aria-label="عرض الموقع" style="display: flex; gap: 12px; align-items: center; text-decoration: none; color: #fff; padding: 4px 8px"><span class="logo-m" style="height: 42px"></span><span style="display: flex; flex-direction: column; gap: 4px"><span class="logo-w" style="height: 18px"></span><span style="font-size: 12px; color: #A9B8C6">لوحة الإدارة</span></span></a>
<nav aria-label="أقسام لوحة التحكم" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="10">
<sc-if value="{{t.isGroup}}" hint-placeholder-val="{{ false }}"><span class="tgrp">{{t.label}}</span></sc-if>
<sc-if value="{{t.isTab}}" hint-placeholder-val="{{ true }}"><button type="button" class="tab" onClick="{{t.pick}}" aria-current="{{t.current}}"><span class="ti"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>{{t.label}}</span><sc-if value="{{t.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; border-radius: 11px; background: #009BD5; color: #101820; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box">{{t.badge}}</span></sc-if></button></sc-if>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
<a href="index.html" style="padding: 10px 12px; font-size: 14px; text-decoration: none">عرض الموقع ↗</a>
<button type="button" class="btn btn-ghost" onClick="{{logout}}" style="min-height: 44px">تسجيل الخروج</button>
</div>
</aside>

<main style="flex: 999 1 680px; min-width: 0; padding: 26px clamp(16px, 3vw, 40px) 72px; box-sizing: border-box">

<!-- شريط الحفظ -->
<div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 22px">
<div><h1 style="margin: 0; font-family: 'Readex Pro', sans-serif; font-size: 28px">{{pageTitle}}</h1><span style="color: #55636F; font-size: 14px">{{pageSub}}</span></div>
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap">
<sc-if value="{{dirty}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #00577A; background: #EAF6FC; padding: 4px 10px; border-radius: 999px; font-weight: 600">تغييرات غير منشورة</span></sc-if>
<a class="btn btn-line" href="index.html" style="min-height: 44px">معاينة الموقع ↗</a>
<button type="button" class="btn btn-sky" onClick="{{publish}}" style="border: 0; min-height: 44px">حفظ ونشر</button>
</div>
</div>

<!-- ===== نظرة عامة ===== -->
<sc-if value="{{tOverview}}" hint-placeholder-val="{{ true }}">
<div class="panel" style="display: flex; flex-direction: column; gap: 22px">
<div class="stag" style="display: flex; flex-wrap: wrap; gap: 14px">
<button type="button" class="card lift" onClick="{{goOrders}}" style="--i: 0; flex: 1 1 180px; text-align: right; padding: 20px; display: flex; flex-direction: column; gap: 4px; background: #101820; border-color: #101820"><span style="color: #A9B8C6; font-size: 14px">طلبات جديدة</span><span style="font-family: 'Readex Pro', sans-serif; font-size: 34px; font-weight: 700; color: #38B6E6">{{newOrders}}</span></button>
<button type="button" class="card lift" onClick="{{goOrders}}" style="--i: 1; flex: 1 1 180px; text-align: right; padding: 20px; color: #101820; display: flex; flex-direction: column; gap: 4px"><span style="color: #55636F; font-size: 14px">قيد التنفيذ</span><span style="font-family: 'Readex Pro', sans-serif; font-size: 34px; font-weight: 700">{{progOrders}}</span></button>
<button type="button" class="card lift" onClick="{{goProducts}}" style="--i: 2; flex: 1 1 180px; text-align: right; padding: 20px; color: #101820; display: flex; flex-direction: column; gap: 4px"><span style="color: #55636F; font-size: 14px">المنتجات</span><span style="font-family: 'Readex Pro', sans-serif; font-size: 34px; font-weight: 700">{{productCount}}</span></button>
<button type="button" class="card lift" onClick="{{goArticles}}" style="--i: 3; flex: 1 1 180px; text-align: right; padding: 20px; color: #101820; display: flex; flex-direction: column; gap: 4px"><span style="color: #55636F; font-size: 14px">مقالات منشورة</span><span style="font-family: 'Readex Pro', sans-serif; font-size: 34px; font-weight: 700">{{pubArticles}}</span></button>
</div>
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
<strong style="font-family: 'Readex Pro', sans-serif; font-size: 18px">إجراءات سريعة</strong>
<div class="stag" style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button type="button" class="opt lift-l" onClick="{{q.go}}" style="--i: {{q.i}}; flex: 1 1 200px; min-height: 96px"><span style="width: 40px; height: 40px; border-radius: 12px; background: #EAF6FC; color: #009BD5; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{q.icon}}"></path></svg></span><strong>{{q.label}}</strong><span class="hint">{{q.hint}}</span></button>
</sc-for>
</div>
</div>
<div class="card" style="overflow: hidden">
<div style="padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #DDE4EA"><strong style="font-family: 'Readex Pro', sans-serif; font-size: 18px">أحدث الطلبات</strong><button type="button" onClick="{{goOrders}}" style="background: transparent; border: 0; color: #00739E; font-weight: 700; min-height: 44px">عرض الكل ←</button></div>
<div style="overflow-x: auto"><table class="tbl"><thead><tr><th>رقم</th><th>الزبون</th><th>النوع</th><th>التفاصيل</th><th>الحالة</th></tr></thead><tbody>
<sc-for list="{{latest}}" as="o" hint-placeholder-count="4"><tr><td>{{o.no}}</td><td>{{o.customer}}</td><td>{{o.typeLabel}}</td><td style="color: #55636F">{{o.item}}</td><td><span class="pill {{o.stClass}}">{{o.statusLabel}}</span></td></tr></sc-for>
</tbody></table></div>
</div>
</div>
</sc-if>

<!-- ===== إعلان منتج جديد ===== -->
<sc-if value="{{tLaunch}}" hint-placeholder-val="{{ false }}">
<div class="panel" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<div style="flex: 1.5 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap"><strong style="font-family: 'Readex Pro', sans-serif; font-size: 18px">١. المنتج والرسالة</strong><div class="lt-tabs" role="group" aria-label="لغة المحتوى"><sc-for list="{{langTabs}}" as="l" hint-placeholder-count="2"><button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}">{{l.label}}</button></sc-for></div></div>
<div class="fl"><label for="ln-prod">اربطه بمنتج من المتجر</label><select id="ln-prod" class="field field-l" value="{{launchProd}}" onChange="{{setLaunchProd}}"><sc-for list="{{machineOpts}}" as="m" hint-placeholder-count="6"><option value="{{m.id}}">{{m.name}}</option></sc-for></select><span class="hint">يظهر عليه شارة «جديد» في المتجر.</span></div>
<div class="fl"><label for="ln-name">اسم المنتج / عنوان الإعلان ({{edLangName}})</label><input id="ln-name" class="field field-l" type="text" dir="{{edDir}}" value="{{launchName}}" onInput="{{setLaunchName}}"></div>
<div class="fl"><label for="ln-text">وصف قصير ({{edLangName}})</label><textarea id="ln-text" class="field field-l" rows="3" dir="{{edDir}}" value="{{launchText}}" onInput="{{setLaunchText}}"></textarea></div>
<div class="fl"><label for="ln-date">تاريخ التوفر ({{edLangName}})</label><input id="ln-date" class="field field-l" type="text" dir="{{edDir}}" value="{{launchDate}}" onInput="{{setLaunchDate}}" placeholder="مثلاً: متوفر الآن / من ١ كانون الأول"></div>
<div class="fl"><span class="lb">صورة الإعلان</span>
<div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
<sc-if value="{{launchHasImg}}" hint-placeholder-val="{{ false }}"><img src="{{site.launch.img}}" alt="" style="width: 120px; height: 80px; object-fit: cover; border-radius: 10px"></sc-if>
<label class="upl">رفع صورة<input type="file" accept="image/*" onChange="{{uploadLaunch}}"></label>
<button type="button" class="btn btn-line" onClick="{{pickLaunch}}" style="min-height: 44px">من مكتبة الوسائط</button>
</div></div>
</div>
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
<strong style="font-family: 'Readex Pro', sans-serif; font-size: 18px">٢. أماكن الظهور</strong>
<span class="hint">اختر أين يرى الزائر الإعلان. التوصية: الشريط العلوي + قسم «جديد النهرين» + خبر — بدون نوافذ منبثقة مزعجة.</span>
<sc-for list="{{placements}}" as="p" hint-placeholder-count="5">
<div class="row"><span style="width: 36px; height: 36px; border-radius: 10px; background: #EAF6FC; color: #009BD5; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span><span style="flex: 1; min-width: 180px; display: flex; flex-direction: column"><strong style="font-weight: 600">{{p.label}}</strong><span class="hint">{{p.hint}}</span></span><button type="button" class="sw" role="switch" aria-checked="{{p.on}}" onClick="{{p.toggle}}" aria-label="{{p.label}}" disabled="{{p.locked}}"></button></div>
</sc-for>
<div class="fl"><label for="ln-ann">نص الشريط العلوي ({{edLangName}})</label><input id="ln-ann" class="field field-l" type="text" dir="{{edDir}}" value="{{annText}}" onInput="{{setAnnText}}"></div>
</div>
<div class="card" style="padding: 22px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end">
<strong style="flex: 1 1 100%; font-family: 'Readex Pro', sans-serif; font-size: 18px">٣. الجدولة</strong>
<div class="fl" style="flex: 1 1 180px"><label for="ln-s">يبدأ في</label><input id="ln-s" class="field field-l" type="date" value="{{site.launch.start}}" onChange="{{setStart}}"></div>
<div class="fl" style="flex: 1 1 180px"><label for="ln-e">ينتهي في</label><input id="ln-e" class="field field-l" type="date" value="{{site.launch.end}}" onChange="{{setEnd}}"></div>
<button type="button" class="btn btn-sky" onClick="{{publishLaunch}}" style="border: 0">نشر الإعلان الآن</button>
</div>
</div>
<div class="card" style="flex: 1 1 320px; min-width: 0; padding: 16px; position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px">
<strong style="font-family: 'Readex Pro', sans-serif">معاينة الإعلان</strong>
<sc-if value="{{annOnPv}}" hint-placeholder-val="{{ true }}"><div style="background: #009BD5; color: #101820; border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center"><span class="ann-tag" style="font-size: 11px">جديد</span>{{annText}}</div></sc-if>
<div style="background: #EAF6FC; border-radius: 16px; overflow: hidden">
<div style="position: relative; height: 170px">
<sc-if value="{{launchHasImg}}" hint-placeholder-val="{{ false }}"><img src="{{site.launch.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
<sc-if value="{{launchNoImg}}" hint-placeholder-val="{{ true }}"><div class="ph ph-l" style="height: 100%">صورة الإعلان</div></sc-if>
<span class="new-badge" style="position: absolute; top: 10px; right: 10px">جديد</span>
</div>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 6px" dir="{{edDir}}"><strong style="font-family: 'Readex Pro', sans-serif; font-size: 16px; line-height: 1.4">{{launchName}}</strong><span style="font-size: 13px; color: #3C4C59">{{launchText}}</span><span style="font-size: 12px; font-weight: 700; color: #00577A">{{launchDate}}</span></div>
</div>
<span class="hint">{{launchStatus}}</span>
</div>
</div>
</sc-if>

<!-- ===== المنتجات ===== -->
<sc-if value="{{tProducts}}" hint-placeholder-val="{{ false }}">
<div class="panel" style="display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
<div role="group" aria-label="القسم" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{depFilters}}" as="f" hint-placeholder-count="4"><button type="button" class="seg" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">{{f.label}}</button></sc-for></div>
<button type="button" class="btn btn-sky" onClick="{{newProduct}}" style="border: 0">+ إضافة منتج</button>
</div>
<div class="card" style="overflow-x: auto">
<table class="tbl"><thead><tr><th>المنتج</th><th>القسم</th><th>التصنيف</th><th>المقاسات / الموديل</th><th>السعر (د.ع)</th><th>الحالة</th><th>إجراءات</th></tr></thead><tbody>
<sc-for list="{{products}}" as="p" hint-placeholder-count="6"><tr>
<td><div style="display: flex; gap: 12px; align-items: center"><span class="ph ph-g" style="width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0; padding: 0"></span><span style="display: flex; flex-direction: column"><strong style="font-weight: 600">{{p.name}}</strong><span class="hint">{{p.nameEn}}</span></span><sc-if value="{{p.isNew}}" hint-placeholder-val="{{ false }}"><span class="new-badge">جديد</span></sc-if></div></td>
<td>{{p.depLabel}}</td><td>{{p.cat}}</td><td style="color: #55636F">{{p.sizes}}</td><td>{{p.price}}</td><td><span class="pill {{p.stClass}}">{{p.statusLabel}}</span></td>
<td><div style="display: flex; gap: 6px">
<button type="button" class="ib" onClick="{{p.edit}}" aria-label="تعديل {{p.name}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>

<!-- محرّر المنتج -->
<sc-if value="{{formOpen}}" hint-placeholder-val="{{ false }}">
<div class="shade" onClick="{{closeForm}}"></div>
<div class="drawer" role="dialog" aria-label="{{formTitle}}" style="background: #FFFFFF; border-right-color: #DDE4EA; color: #101820">
<div style="padding: 18px 22px; border-bottom: 1px solid #DDE4EA; display: flex; justify-content: space-between; align-items: center"><strong style="font-family: 'Readex Pro', sans-serif; font-size: 21px">{{formTitle}}</strong><button type="button" class="ib" onClick="{{closeForm}}" aria-label="إغلاق"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<div style="flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div class="fl"><span class="lb">صور المنتج</span><label class="upl" style="align-self: flex-start">رفع صور<input type="file" accept="image/*" multiple="multiple"></label></div>
<div class="fl"><label for="d-name">الاسم بالعربي</label><input id="d-name" class="field field-l" type="text" value="{{draft.name}}" onInput="{{setName}}"></div>
<div class="fl"><label for="d-nameen">Name in English</label><input id="d-nameen" class="field field-l" type="text" dir="ltr" value="{{draft.nameEn}}" onInput="{{setNameEn}}"></div>
<div class="fl"><label for="d-dep">القسم</label><select id="d-dep" class="field field-l" value="{{draft.dep}}" onChange="{{setDep}}"><option value="mac">المكائن</option><option value="part">قطع الغيار</option><option value="mat">مواد الإعلان</option></select></div>
<div class="fl"><label for="d-cat">التصنيف</label><select id="d-cat" class="field field-l" value="{{draft.cat}}" onChange="{{setCat}}"><sc-for list="{{catOptions}}" as="c" hint-placeholder-count="5"><option value="{{c}}">{{c}}</option></sc-for></select></div>
<div class="fl"><label for="d-sizes">{{sizesLabel}}</label><input id="d-sizes" class="field field-l" type="text" value="{{draft.sizes}}" onInput="{{setSizes}}"></div>
<sc-if value="{{isMachineForm}}" hint-placeholder-val="{{ false }}"><div class="fl"><label for="d-specs">المواصفات الفنية</label><textarea id="d-specs" class="field field-l" rows="4" placeholder="عرض الطباعة: …"></textarea></div></sc-if>
<div class="fl"><label for="d-st">حالة التوفر</label><select id="d-st" class="field field-l" value="{{draft.st}}" onChange="{{setSt}}"><option value="ok">متوفر</option><option value="low">كمية محدودة</option><option value="out">غير متوفر</option></select></div>
<div class="fl"><label for="d-price">السعر (دينار عراقي)</label><input id="d-price" class="field field-l" type="text" inputmode="numeric" placeholder="فارغ = «اطلب عرض سعر»" value="{{draft.price}}" onInput="{{setPrice}}"></div>
</div>
<div style="padding: 18px 22px; border-top: 1px solid #DDE4EA; display: flex; gap: 10px"><button type="button" class="btn btn-sky" onClick="{{saveProduct}}" style="flex: 1; border: 0">حفظ</button><button type="button" class="btn btn-line" onClick="{{closeForm}}">إلغاء</button></div>
</div>
</sc-if>

<!-- محرّر المقال -->
<sc-if value="{{artOpen}}" hint-placeholder-val="{{ false }}">
<div class="shade" onClick="{{closeArt}}"></div>
<div class="drawer wide" role="dialog" aria-label="محرّر المقال" style="background: #FFFFFF; border-right-color: #DDE4EA; color: #101820">
<div style="padding: 16px 22px; border-bottom: 1px solid #DDE4EA; display: flex; justify-content: space-between; align-items: center; gap: 10px"><strong style="font-family: 'Readex Pro', sans-serif; font-size: 20px">{{artTitle}}</strong><div style="display: flex; gap: 8px; align-items: center"><div class="lt-tabs" role="group" aria-label="لغة المقال"><sc-for list="{{langTabs}}" as="l" hint-placeholder-count="2"><button type="button" onClick="{{l.pick}}" aria-pressed="{{l.pressed}}">{{l.label}}</button></sc-for></div><button type="button" class="ib" onClick="{{closeArt}}" aria-label="إغلاق"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div></div>
<div style="flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px">
<div class="fl"><span class="lb">صورة الغلاف</span><div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap"><sc-if value="{{ad.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{ad.img}}" alt="" style="width: 140px; height: 90px; object-fit: cover; border-radius: 10px"></sc-if><label class="upl">رفع صورة<input type="file" accept="image/*" onChange="{{uploadArt}}"></label><button type="button" class="btn btn-line" onClick="{{pickArt}}" style="min-height: 44px">من مكتبة الوسائط</button></div></div>
<div class="fl"><label for="a-title">العنوان ({{edLangName}})</label><input id="a-title" class="field field-l" type="text" dir="{{edDir}}" value="{{ad.title}}" onInput="{{aSet.title}}" style="font-size: 18px; font-weight: 600"></div>
<div class="fl"><label for="a-ex">مقتطف قصير ({{edLangName}})</label><textarea id="a-ex" class="field field-l" rows="2" dir="{{edDir}}" value="{{ad.ex}}" onInput="{{aSet.ex}}"></textarea></div>
<div class="fl"><label for="a-body">نص المقال ({{edLangName}})</label>
<div style="display: flex; gap: 6px; flex-wrap: wrap"><button type="button" class="ib" onClick="{{fmt.h}}" aria-label="إضافة عنوان فرعي" style="width: auto; padding: 0 12px; font-weight: 700">عنوان</button><button type="button" class="ib" onClick="{{fmt.li}}" aria-label="إضافة قائمة" style="width: auto; padding: 0 12px">• قائمة</button><button type="button" class="ib" onClick="{{fmt.p}}" aria-label="فقرة جديدة" style="width: auto; padding: 0 12px">¶ فقرة</button></div>
<textarea id="a-body" class="field field-l" rows="12" dir="{{edDir}}" value="{{ad.body}}" onInput="{{aSet.body}}" style="line-height: 1.9"></textarea><span class="hint">افصل الفقرات بسطر فارغ. {{ad.words}} كلمة · {{ad.mins}} دقيقة قراءة</span></div>

<div class="fl" style="flex: 1 1 160px"><label for="a-cat">التصنيف</label><select id="a-cat" class="field field-l" value="{{ad.cat}}" onChange="{{aSetRaw.cat}}"><option value="launch">إطلاق منتجات</option><option value="guide">أدلة الشراء</option><option value="tips">صيانة ونصائح</option><option value="company">أخبار الشركة</option></select></div>
<div class="fl" style="flex: 1 1 160px"><label for="a-st">الحالة</label><select id="a-st" class="field field-l" value="{{ad.status}}" onChange="{{aSetRaw.status}}"><option value="published">منشور</option><option value="draft">مسودة</option><option value="scheduled">مجدول</option></select></div>
<div class="fl" style="flex: 1 1 160px"><label for="a-date">التاريخ</label><input id="a-date" class="field field-l" type="date" value="{{ad.date}}" onChange="{{aSetRaw.date}}"></div>
</div>
<label style="display: flex; gap: 10px; align-items: center; min-height: 44px"><input type="checkbox" checked="{{ad.featured}}" onChange="{{toggleFeat}}" style="width: 20px; height: 20px; accent-color: #009BD5">تثبيته كخبر مميز أعلى صفحة الأخبار</label>
<div style="background: #F6F8FA; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<strong style="font-size: 15px">تحسين الظهور في محركات البحث (SEO)</strong>
<div class="fl"><label for="a-slug">رابط المقال</label><input id="a-slug" class="field field-l" type="text" dir="ltr" value="{{ad.slug}}" onInput="{{aSetRaw.slug}}"></div>
<div class="fl"><label for="a-meta">وصف البحث ({{edLangName}})</label><textarea id="a-meta" class="field field-l" rows="2" dir="{{edDir}}" value="{{ad.meta}}" onInput="{{aSet.meta}}"></textarea><span class="hint">{{ad.metaLen}} / 160 حرف</span></div>

</div>
</div>
<div style="padding: 16px 22px; border-top: 1px solid #DDE4EA; display: flex; gap: 10px; flex-wrap: wrap"><button type="button" class="btn btn-sky" onClick="{{saveArtPub}}" style="flex: 1; border: 0">نشر المقال</button><button type="button" class="btn btn-line" onClick="{{saveArtDraft}}">حفظ كمسودة</button></div>
</div>
</sc-if>

<!-- منتقي الوسائط -->
<sc-if value="{{pickerOpen}}" hint-placeholder-val="{{ false }}">
<div class="shade" onClick="{{closePicker}}"></div>
<div style="position: fixed; inset: 0; z-index: 95; display: flex; align-items: center; justify-content: center; padding: 16px; pointer-events: none">

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px"><sc-for list="{{media}}" as="m" hint-placeholder-count="8"><button type="button" class="mthumb" onClick="{{m.choose}}" aria-label="اختيار {{m.name}}"><img src="{{m.src}}" alt=""></button></sc-for></div>
</div>
</div>
</sc-if>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}"><div class="toast" role="status" style="background: #101820; color: #fff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#38B6E6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{toast}}</div></sc-if>
</sc-if>

</div>
</script>
